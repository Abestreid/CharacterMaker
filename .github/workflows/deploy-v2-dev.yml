name: Deploy CharacterMaker V2 DEV

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-v2-dev.yml'
  workflow_dispatch:

concurrency:
  group: charactermaker-v2-dev
  cancel-in-progress: true

env:
  DEPLOY_DIR: /htdocs/dev
  DEPLOY_URL: https://charmaker.free.nf/dev/

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: refactor-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Add DEV noindex protection
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<meta name="robots" content="noindex,nofollow,noarchive" />'
          if tag not in html:
              if '</head>' not in html:
                  raise SystemExit('Cannot inject robots meta: </head> not found')
              html = html.replace('</head>', f'  {tag}\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          PY

      - name: Validate deploy target
        run: |
          test "$DEPLOY_DIR" = "/htdocs/dev"
          test -f dist/index.html
          test -d dist/assets

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
        working-directory: .

      - name: Deploy DEV to InfinityFree
        env:
          FTP_SERVER: ${{ secrets.CHARMAKER_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.CHARMAKER_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHARMAKER_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          lftp -c "
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -p 21 ftp://$FTP_SERVER;
            user $FTP_USERNAME $FTP_PASSWORD;
            cd $DEPLOY_DIR;
            mirror --reverse --delete --no-perms --verbose --parallel=4 dist/ .;
            bye
          "

      - name: HTTP smoke check
        continue-on-error: true
        run: |
          curl --fail --location --silent --show-error --max-time 30 "$DEPLOY_URL" -o /tmp/charmaker-dev.html
          test -s /tmp/charmaker-dev.html
        working-directory: .

      - name: Install browsers for visual verification
        run: npx --yes playwright@latest install --with-deps chromium webkit
        working-directory: .

      - name: Verify and capture desktop
        run: npx --yes playwright@latest screenshot --device="Desktop Chrome" --wait-for-timeout=5000 --full-page "$DEPLOY_URL" /tmp/charmaker-dev-desktop.png
        working-directory: .

      - name: Verify and capture mobile
        run: npx --yes playwright@latest screenshot --device="iPhone 13" --wait-for-timeout=5000 --full-page "$DEPLOY_URL" /tmp/charmaker-dev-mobile.png
        working-directory: .

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: charmaker-dev-screenshots
          path: |
            /tmp/charmaker-dev-desktop.png
            /tmp/charmaker-dev-mobile.png
          retention-days: 7
