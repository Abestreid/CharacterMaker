name: Deploy CharacterMaker V2 DEV

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-v2-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: charactermaker-v2-dev
  cancel-in-progress: true

env:
  DEPLOY_DIR: /htdocs/dev
  DEPLOY_URL: https://charmaker.free.nf/dev/

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: refactor-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark deployment pending
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state pending \
            --arg target_url "$DEPLOY_URL" \
            --arg description "CharacterMaker V2 DEV deployment in progress" \
            --arg context "deployment/dev" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and tests
        id: check
        run: npm run check

      - name: Production build
        id: build
        run: npm run build

      - name: Add DEV metadata and noindex protection
        id: metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<meta name="robots" content="noindex,nofollow,noarchive" />'
          if tag not in html:
              if '</head>' not in html:
                  raise SystemExit('Cannot inject robots meta: </head> not found')
              html = html.replace('</head>', f'  {tag}\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          Path('dist/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF_NAME'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'built_at': datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validate deploy target
        id: validate
        run: |
          test "$DEPLOY_DIR" = "/htdocs/dev"
          test -f dist/index.html
          test -f dist/build-info.json
          test -d dist/assets

      - name: Install FTP client
        id: ftp_client
        run: sudo apt-get update && sudo apt-get install -y lftp
        working-directory: .

      - name: Deploy DEV to InfinityFree
        id: deploy
        env:
          FTP_SERVER: ${{ secrets.CHARMAKER_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.CHARMAKER_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHARMAKER_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          lftp -c "
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -p 21 ftp://$FTP_SERVER;
            user $FTP_USERNAME $FTP_PASSWORD;
            cd $DEPLOY_DIR;
            mirror --reverse --delete --no-perms --verbose --parallel=4 dist/ .;
            bye
          "

      - name: Verify deployed commit over FTP
        id: verify_ftp
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.CHARMAKER_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.CHARMAKER_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHARMAKER_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          rm -f /tmp/charmaker-build-info.json
          lftp -c "
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -p 21 ftp://$FTP_SERVER;
            user $FTP_USERNAME $FTP_PASSWORD;
            cd $DEPLOY_DIR;
            get build-info.json -o /tmp/charmaker-build-info.json;
            bye
          "
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          remote = json.loads(Path('/tmp/charmaker-build-info.json').read_text(encoding='utf-8'))
          expected = os.environ['GITHUB_SHA']
          actual = remote.get('commit')
          if actual != expected:
              raise SystemExit(f'Remote DEV commit mismatch: expected {expected}, got {actual}')
          print(f'VERIFIED_REMOTE_COMMIT={actual}')
          PY

      - name: HTTP smoke check
        id: http
        run: |
          curl --fail --location --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$DEPLOY_URL?commit=$GITHUB_SHA" -o /tmp/charmaker-dev.html
          test -s /tmp/charmaker-dev.html
        working-directory: .

      - name: Install browsers for mandatory visual verification
        id: browsers
        run: npx --yes playwright@latest install --with-deps chromium webkit
        working-directory: .

      - name: Verify and capture desktop Chrome
        id: desktop
        run: npx --yes playwright@latest screenshot --browser=chromium --device="Desktop Chrome" --wait-for-timeout=5000 --full-page "$DEPLOY_URL?commit=$GITHUB_SHA" /tmp/charmaker-dev-desktop-chrome.png
        working-directory: .

      - name: Verify and capture iOS Safari profile
        id: ios
        run: npx --yes playwright@latest screenshot --browser=webkit --device="iPhone 13" --wait-for-timeout=5000 --full-page "$DEPLOY_URL?commit=$GITHUB_SHA" /tmp/charmaker-dev-ios-webkit.png
        working-directory: .

      - name: Verify and capture Android Chrome profile
        id: android
        run: npx --yes playwright@latest screenshot --browser=chromium --device="Pixel 5" --wait-for-timeout=5000 --full-page "$DEPLOY_URL?commit=$GITHUB_SHA" /tmp/charmaker-dev-android-chrome.png
        working-directory: .

      - name: Upload visual verification
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: charmaker-dev-screenshots
          path: |
            /tmp/charmaker-dev-desktop-chrome.png
            /tmp/charmaker-dev-ios-webkit.png
            /tmp/charmaker-dev-android-chrome.png
          if-no-files-found: ignore
          retention-days: 7

      - name: TEMP report exact deployment stage on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deploy-stage.md <<EOF
          Temporary deployment diagnostic for commit $GITHUB_SHA.

          - dependencies: ${{ steps.dependencies.outcome }}
          - check: ${{ steps.check.outcome }}
          - build: ${{ steps.build.outcome }}
          - metadata: ${{ steps.metadata.outcome }}
          - validate: ${{ steps.validate.outcome }}
          - ftp_client: ${{ steps.ftp_client.outcome }}
          - deploy: ${{ steps.deploy.outcome }}
          - verify_ftp: ${{ steps.verify_ftp.outcome }}
          - http: ${{ steps.http.outcome }}
          - browsers: ${{ steps.browsers.outcome }}
          - desktop: ${{ steps.desktop.outcome }}
          - ios: ${{ steps.ios.outcome }}
          - android: ${{ steps.android.outcome }}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP DEV deployment stage ${GITHUB_SHA:0:7}" --body-file /tmp/deploy-stage.md

      - name: Mark deployment success
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state success \
            --arg target_url "$DEPLOY_URL" \
            --arg description "V2 DEV deployed and verified on desktop, iOS WebKit and Android Chrome" \
            --arg context "deployment/dev" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null

      - name: Mark deployment failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state failure \
            --arg target_url "$DEPLOY_URL" \
            --arg description "V2 DEV build/deploy/device verification failed" \
            --arg context "deployment/dev" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
