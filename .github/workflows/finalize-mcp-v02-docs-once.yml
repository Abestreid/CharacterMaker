name: Finalize MCP v0.2 main documentation once

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - '.github/workflows/finalize-mcp-v02-docs-once.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: refactor/domain-catalog-v2
          fetch-depth: 0

      - name: Update authoritative docs
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('refactor-v2/docs/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## 2026-08-08' not in text:
              marker = '## 2026-08-07\n'
              entry = '''## 2026-08-08\n\n### MCP v0.2.0 visual and native-generation workflow\n\n- CharacterMaker MCP обновлен с `0.1.0` до `0.2.0` и развернут как Edge Function version 2 на прежнем endpoint;\n- добавлен `get_visual_package`: UUID/slug/exact name -> ranking сохраненных assets -> actual MCP image content в одном вызове;\n- добавлен `prepare_image_generation`: Persona + optional Outfit/Scene -> `generation-context-v2` + primary face/body + recommended references + actual image content + `host_action=native_image_generation`;\n- зафиксировано обязательное поведение MCP host: если пользователь просит создать изображение и host имеет native image generator, после `prepare_image_generation` он должен продолжить генерацию, а не останавливаться из-за отсутствия `generate_image` внутри CharacterMaker;\n- `search_presets` теперь ранжирует exact name/slug первым и возвращает `exact_match`, asset/canonical/approved counts и preview asset;\n- `get_preset` принимает UUID/slug/exact unique name, стабильно возвращает `include_assets=true`, не тащит binary images и не дублирует полную карточку в text + structured output;\n- `metadata.editor_state` исключен из MCP card output: source of truth для MCP - normal columns + normalized parameter rows;\n- добавлен ranking visual references: `canonical > approved > reference_only > normal`, rejected исключается, учитываются `is_primary`, semantic role и sort order;\n- multimodal workflow изолирует ошибки отдельных картинок и ограничивает combined inline payload 12 MB;\n- общий Web Core синхронизирован на `generation-context-v2`, добавлены `VisualPackage`, primary face/body и recommended asset IDs;\n- добавлены Core regression tests для canonical/primary/role ranking, rejected exclusion и missing body warning;\n- постоянный MCP smoke теперь воспроизводит реальные проблемные сценарии: exact `Victoria June`, `get_preset(include_assets=true)`, canonical photo через `get_visual_package`, полный `prepare_image_generation`, а также Лайвет;\n- расширенный remote MCP smoke завершился успешно;\n- данные Персон/Образов/Сцен, измерения, catalog values и reference statuses в этом пакете не изменялись;\n- подробности: `docs/changes/2026-08-08-mcp-visual-generation-workflow.md` и `docs/MCP_ARCHITECTURE.md`.\n\n'''
              if marker not in text:
                  raise SystemExit('Could not locate 2026-08-07 changelog marker')
              text = text.replace(marker, entry + marker, 1)
              changelog.write_text(text, encoding='utf-8')

          readme = Path('refactor-v2/supabase/README.md')
          r = readme.read_text(encoding='utf-8')
          mcp_marker = '## CharacterMaker MCP Edge Function\n\n'
          version_note = 'Current deployed MCP server version: `0.2.0` (Edge Function version 2).\n\n'
          if version_note not in r:
              if mcp_marker not in r:
                  raise SystemExit('Could not locate MCP README section')
              r = r.replace(mcp_marker, mcp_marker + version_note, 1)

          workflow_section = '''### Visual and native-image-generation workflow\n\nCharacterMaker is the canonical Persona/Outfit/Scene/reference source; it is not required to be the image-generation provider.\n\nHigh-level MCP workflows:\n\n- structured card -> `get_preset`;\n- show/get saved photos -> `get_visual_package(include_images=true)`;\n- create/generate an image -> `prepare_image_generation(include_images=true)` and then the MCP host's native image generator when available;\n- one known asset -> `get_asset(include_image=true)`;\n- partial edit -> `patch_preset`.\n\n`prepare_image_generation` returns `generation-context-v2`, ranked visual references, actual MCP image content and `host_action=native_image_generation`. A compatible host such as ChatGPT must not stop merely because CharacterMaker itself has no provider-specific `generate_image` MCP tool.\n\nVisual ranking prefers `canonical`, then `approved`, `reference_only`, `normal`; rejected assets are excluded. Primary flag, semantic role and relation order are additional signals.\n\nThe Web Core uses the same `generation-context-v2` / visual-package concepts. MCP only adds protocol-specific multimodal content and host-action instructions.\n\nThe 2026-08-08 MCP v0.2 correction changed service/Core/MCP behavior only and did not modify saved Persona/Outfit/Scene data or asset statuses.\n\n'''
          catalog_marker = '## Catalog system\n'
          if '### Visual and native-image-generation workflow' not in r:
              if catalog_marker not in r:
                  raise SystemExit('Could not locate catalog section in Supabase README')
              r = r.replace(catalog_marker, workflow_section + catalog_marker, 1)

          r = r.replace('generation-context-v1', 'generation-context-v2')
          old_tools = '''The MCP exposes read/write operations for:\n\n- search and complete Persona/Outfit/Scene retrieval;\n- catalogs and current schema;\n- generation context assembly;\n- create and partial patch;\n- asset listing/read/image content;\n- public-image URL import to InfinityFree;\n- canonical/reference status;\n- soft archive.\n'''
          new_tools = '''The MCP exposes read/write operations for:\n\n- ranked search and complete Persona/Outfit/Scene retrieval;\n- high-level visual package with actual MCP image content;\n- complete native-host image-generation preparation;\n- catalogs and current schema;\n- `generation-context-v2` assembly;\n- create and partial patch;\n- asset listing/read/image content;\n- public-image URL import to InfinityFree;\n- canonical/reference status;\n- soft archive.\n'''
          if old_tools in r:
              r = r.replace(old_tools, new_tools, 1)

          old_smoke = 'The smoke workflow has successfully verified health, initialize/initialized handshake, tools/list, real database reads, catalog reads and actual image content from an external GitHub runner.'
          new_smoke = 'The smoke workflow now also permanently verifies the previously failing visual workflow: exact `Victoria June` search, `get_preset(include_assets=true)`, canonical image output through `get_visual_package`, `prepare_image_generation` with real reference image content and native-generation host action, plus the Лайвет fallback-reference path.'
          if old_smoke in r:
              r = r.replace(old_smoke, new_smoke, 1)
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-mcp-v02-docs-once.yml
          git add refactor-v2/docs/CHANGELOG.md refactor-v2/supabase/README.md
          git diff --cached --check
          git commit -m 'docs: finalize MCP v0.2 visual generation architecture'
          git push origin HEAD:refactor/domain-catalog-v2
