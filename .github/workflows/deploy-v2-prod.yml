name: Deploy CharacterMaker V2 PROD

on:
  push:
    branches:
      - prod/v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-v2-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charactermaker-v2-prod
  cancel-in-progress: false

env:
  DEPLOY_DIR: /htdocs
  DEPLOY_URL: https://charmaker.free.nf/

jobs:
  build-test-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'ci: configure V2 production deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: refactor-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Validate deploy target
        run: |
          test "$DEPLOY_DIR" = "/htdocs" || {
            echo "Unsafe PROD deploy path: $DEPLOY_DIR"
            exit 1
          }
          test -f dist/index.html
          test -d dist/assets
          ! grep -q 'noindex,nofollow,noarchive' dist/index.html || {
            echo "Production build unexpectedly contains DEV noindex"
            exit 1
          }

      - name: Install FTPS client
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy PROD over FTPS Explicit TLS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          # Intentionally no --delete here: /htdocs/dev must never be removed
          # by production deployment. Current production files are overwritten,
          # while DEV remains isolated in /htdocs/dev.
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 25
          open -p 21 -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse --verbose --parallel=2 dist $DEPLOY_DIR
          bye
          EOF

      - name: Verify PROD URL
        working-directory: .
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_URL" -o /tmp/charactermaker-prod.html
          if grep -q 'noindex,nofollow,noarchive' /tmp/charactermaker-prod.html; then
            echo "Production URL unexpectedly contains DEV noindex"
            exit 1
          fi
          echo "PROD deployment verified: $DEPLOY_URL"
