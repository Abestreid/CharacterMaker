name: Deploy CharacterMaker V2 PROD

on:
  push:
    branches:
      - prod/v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-v2-prod.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: charactermaker-v2-prod
  cancel-in-progress: false

env:
  DEPLOY_DIR: /htdocs
  DEPLOY_URL: https://charmaker.free.nf/

jobs:
  build-test-deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-prod-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: refactor-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state pending \
            --arg target_url "$DEPLOY_URL" \
            --arg description "CharacterMaker V2 PROD deployment in progress" \
            --arg context "deployment/prod" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "DEPLOY_STAGE=dependencies" >> "$GITHUB_ENV"
          npm install --no-audit --no-fund

      - name: Typecheck and tests
        run: |
          echo "DEPLOY_STAGE=checks" >> "$GITHUB_ENV"
          npm run check

      - name: Production build
        run: |
          echo "DEPLOY_STAGE=build" >> "$GITHUB_ENV"
          npm run build

      - name: Validate production build and target
        run: |
          echo "DEPLOY_STAGE=target-validation" >> "$GITHUB_ENV"
          test "$DEPLOY_DIR" = "/htdocs" || {
            echo "Unsafe PROD deploy path: $DEPLOY_DIR"
            exit 1
          }
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'noindex,nofollow,noarchive' dist/index.html; then
            echo "Production build unexpectedly contains DEV noindex"
            exit 1
          fi

      - name: Set FTPS deployment stage
        working-directory: .
        run: echo "DEPLOY_STAGE=ftps-deploy" >> "$GITHUB_ENV"

      - name: Deploy PROD over FTPS Explicit TLS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 120000
          local-dir: ./refactor-v2/dist/
          server-dir: /htdocs/
          state-name: .ftp-deploy-sync-state-prod-v2.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            dev/
            dev/**

      - name: Setup Chrome for browser verification
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: stable

      - name: Verify PROD URL in real browser
        working-directory: .
        run: |
          echo "DEPLOY_STAGE=browser-verify" >> "$GITHUB_ENV"
          chrome --version
          chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=15000 \
            --dump-dom \
            "$DEPLOY_URL" > /tmp/charactermaker-prod.html

          if grep -q 'noindex,nofollow,noarchive' /tmp/charactermaker-prod.html; then
            echo "Production URL unexpectedly contains DEV noindex"
            exit 1
          fi
          grep -q 'AI Character Maker V2' /tmp/charactermaker-prod.html || \
            grep -q 'CharacterMaker' /tmp/charactermaker-prod.html
          echo "PROD browser verification passed: $DEPLOY_URL"

      - name: Mark deployment success
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state success \
            --arg target_url "$DEPLOY_URL" \
            --arg description "CharacterMaker V2 PROD deployed and browser-verified" \
            --arg context "deployment/prod" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null

      - name: Mark deployment failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="${DEPLOY_STAGE:-unknown}"
          for context in "deployment/prod" "deployment/prod/failure/$stage"; do
            payload=$(jq -n \
              --arg state failure \
              --arg target_url "$DEPLOY_URL" \
              --arg description "CharacterMaker V2 PROD failed at $stage" \
              --arg context "$context" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$payload" >/dev/null
          done
