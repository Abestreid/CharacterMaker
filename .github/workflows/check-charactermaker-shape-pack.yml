name: Check CharacterMaker Shape Pack

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/scripts/patch_oxihuman_charactermaker.py'
      - 'refactor-v2/src/lib/body3d/**'
      - '.github/workflows/check-charactermaker-shape-pack.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  OXIHUMAN_COMMIT: 603b446854c3d5a9ca478214e7b85008d54786b9

jobs:
  shape-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: ${{ env.OXIHUMAN_COMMIT }}
          path: .vendor/oxihuman
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Patch runtime and build CharacterMaker OHPK
        run: |
          set -euxo pipefail
          python3 refactor-v2/scripts/patch_oxihuman_charactermaker.py .vendor/oxihuman
          cd .vendor/oxihuman

          # Lock the restored macro blend mathematically before packaging data.
          cargo test -p oxihuman-wasm charactermaker_breast_macro_tests -- --nocapture

          scripts/fetch_upstream_assets.sh
          cargo run --release -p oxihuman-cli -- \
            pack-core \
            --tier core \
            --budget-gzip-bytes 12582912
          test -s assets/packs/oxihuman-core-v1.ohpk
          test -s assets/packs/oxihuman-core-v1.provenance.json

          python3 - <<'PY'
          import json
          p='assets/packs/oxihuman-core-v1.provenance.json'
          d=json.load(open(p, encoding='utf-8'))
          rows=d.get('targets', [])
          names={x['name'] for x in rows}
          details={x['name'] for x in rows if x.get('category') == 'charactermaker_shape'}
          breast=[x['name'] for x in rows if x.get('category') == 'charactermaker_breast_macro']

          required={
              'breast/breast-point-incr',
              'breast/breast-volume-vert-up',
              'buttocks/buttocks-volume-incr',
              'hip/hip-scale-depth-incr',
              'breast/female-young-averagemuscle-averageweight-mincup-averagefirmness',
              'breast/female-young-averagemuscle-averageweight-averagecup-averagefirmness',
              'breast/female-young-averagemuscle-averageweight-maxcup-averagefirmness',
              'breast/female-young-averagemuscle-averageweight-averagecup-minfirmness',
              'breast/female-young-averagemuscle-averageweight-averagecup-maxfirmness',
          }
          missing=sorted(required - names)
          if missing:
              raise SystemExit(f'Missing CharacterMaker body targets: {missing}')
          if len(details) < 16:
              raise SystemExit(f'Expected >=16 direct shape targets, got {len(details)}')
          # 2 adult ages * 3 muscle * 3 weight * 3 cup * 3 firmness.
          if len(breast) < 162:
              raise SystemExit(f'Expected 162 adult female breast macro corners, got {len(breast)}')
          if any('child' in n or 'baby' in n for n in breast):
              raise SystemExit('Non-adult breast macro leaked into CharacterMaker pack')
          if any(token in n for n in names for token in ('nipple', 'areola', 'genital', 'penis', 'vagina')):
              raise SystemExit('Explicit anatomy target leaked into CharacterMaker pack')
          print('DIRECT_SHAPE_TARGETS=', len(details))
          print('BREAST_MACRO_TARGETS=', len(breast))
          print('TOTAL_TARGETS=', len(names))
          PY

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterBody pack contains cup/firmness macro lattice\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterBody macro pack build failed\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null
