name: Check CharacterMaker Shape Pack

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/scripts/patch_oxihuman_charactermaker.py'
      - 'refactor-v2/scripts/validate_charactermaker_body_pack.py'
      - 'refactor-v2/src/lib/body3d/**'
      - '.github/workflows/check-charactermaker-shape-pack.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  OXIHUMAN_COMMIT: 603b446854c3d5a9ca478214e7b85008d54786b9

jobs:
  shape-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: ${{ env.OXIHUMAN_COMMIT }}
          path: .vendor/oxihuman
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Patch runtime and build CharacterBody v4 OHPK
        run: |
          set -euxo pipefail
          python3 refactor-v2/scripts/patch_oxihuman_charactermaker.py .vendor/oxihuman
          cd .vendor/oxihuman

          # Lock cup and firmness as independent macro dimensions in WASM.
          cargo test -p oxihuman-wasm charactermaker_breast_macro_tests -- --nocapture

          scripts/fetch_upstream_assets.sh
          cargo run --release -p oxihuman-cli -- \
            pack-core \
            --tier core \
            --budget-gzip-bytes 12582912
          test -s assets/packs/oxihuman-core-v1.ohpk
          test -s assets/packs/oxihuman-core-v1.provenance.json
          python3 ../../refactor-v2/scripts/validate_charactermaker_body_pack.py \
            assets/packs/oxihuman-core-v1.provenance.json

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterBody v4 pack: 162 breast macro corners verified\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterBody v4 macro pack build failed\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null
