name: Check CharacterMaker Shape Pack

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/scripts/patch_oxihuman_charactermaker.py'
      - '.github/workflows/check-charactermaker-shape-pack.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  OXIHUMAN_COMMIT: 603b446854c3d5a9ca478214e7b85008d54786b9

jobs:
  shape-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: ${{ env.OXIHUMAN_COMMIT }}
          path: .vendor/oxihuman
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Patch and build custom OHPK
        run: |
          set -euxo pipefail
          python3 refactor-v2/scripts/patch_oxihuman_charactermaker.py .vendor/oxihuman
          cd .vendor/oxihuman
          scripts/fetch_upstream_assets.sh
          cargo run --release -p oxihuman-cli -- \
            pack-core \
            --tier core \
            --budget-gzip-bytes 4194304
          test -s assets/packs/oxihuman-core-v1.ohpk
          test -s assets/packs/oxihuman-core-v1.provenance.json
          grep -q 'breast/breast-point-incr' assets/packs/oxihuman-core-v1.provenance.json
          grep -q 'breast/breast-volume-vert-up' assets/packs/oxihuman-core-v1.provenance.json
          grep -q 'buttocks/buttocks-volume-incr' assets/packs/oxihuman-core-v1.provenance.json
          grep -q 'hip/hip-scale-depth-incr' assets/packs/oxihuman-core-v1.provenance.json
          python3 - <<'PY'
          import json
          p='assets/packs/oxihuman-core-v1.provenance.json'
          d=json.load(open(p, encoding='utf-8'))
          custom=[x['name'] for x in d['targets'] if x.get('category') == 'charactermaker_shape']
          print('CUSTOM_TARGET_COUNT=', len(custom))
          print('\n'.join(custom))
          if len(custom) < 16:
              raise SystemExit(f'Expected 16 CharacterMaker targets, got {len(custom)}')
          PY

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterMaker custom OHPK contains shape targets\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"CharacterMaker custom OHPK build failed\",\"context\":\"diagnostic/shape-pack\"}" >/dev/null
