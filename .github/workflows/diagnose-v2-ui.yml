name: TEMP Diagnose V2 UI

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/diagnose-v2-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: refactor-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run check and report exact failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/v2-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/v2-check.log > /tmp/v2-check-tail.log
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "TEMP V2 UI diagnostic ${GITHUB_SHA:0:7}" \
              --body-file /tmp/v2-check-tail.log
            exit "$status"
          fi
