name: TEMP Diagnose V2 UI

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/diagnose-v2-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: refactor-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run check and build and report result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo '=== npm run check ==='
            npm run check
            check_status=$?
            echo "CHECK_STATUS=$check_status"
            if [ "$check_status" -eq 0 ]; then
              echo '=== npm run build ==='
              npm run build
              build_status=$?
            else
              build_status=99
            fi
            echo "BUILD_STATUS=$build_status"
          } 2>&1 | tee /tmp/v2-diagnostic.log
          check_status=$(grep '^CHECK_STATUS=' /tmp/v2-diagnostic.log | tail -1 | cut -d= -f2)
          build_status=$(grep '^BUILD_STATUS=' /tmp/v2-diagnostic.log | tail -1 | cut -d= -f2)
          tail -n 160 /tmp/v2-diagnostic.log > /tmp/v2-diagnostic-tail.log
          if [ "$check_status" = "0" ] && [ "$build_status" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP V2 UI diagnostic SUCCESS ${GITHUB_SHA:0:7}" --body-file /tmp/v2-diagnostic-tail.log
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP V2 UI diagnostic FAILED ${GITHUB_SHA:0:7}" --body-file /tmp/v2-diagnostic-tail.log
          exit 1
