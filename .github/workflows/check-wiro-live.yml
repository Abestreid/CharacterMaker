name: Check Wiro live API

on:
  push:
    branches:
      - diagnostics/ai-credentials
    paths:
      - '.github/workflows/check-wiro-live.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CIPHER_B64: 'AaPbSpVUbIZBb9U8Pc4iR29Jm/jtrYdi0+GyQbVmr8qXc9HAxuirZbxbDUfteOo9UM2VXaKlZOdD9P4kKNaVYbT2onAlWzI6u1MprB6PZyGZDW5XmTKN6QQmq6mMuZ9wZQQlpl8sZfYPJR/xTiGrsAL+nuqX258iV5ux+UzVpqo='
      IV_HEX: 'b79f476ee654d11116173afcefee4561'
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lftp jq

      - name: Decrypt exact Wiro credentials
        env:
          FTP_SERVER: ${{ secrets.CHARMAKER_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.CHARMAKER_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHARMAKER_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          lftp -c "open -p 21 ftp://$FTP_SERVER; user $FTP_USERNAME $FTP_PASSWORD; cd /htdocs; get .charmaker-ai-settings-dev.php -o /tmp/settings.php; bye"
          horde_b64=$(php -r '$s=require "/tmp/settings.php"; foreach($s["credentials"] as $x) if(($x["provider"]??"")==="aihorde"){echo base64_encode((string)($x["apiKey"]??""));break;}')
          horde_key=$(printf '%s' "$horde_b64" | base64 -d)
          test -n "$horde_key"
          decrypt_hex=$(printf 'CharacterMaker-Wiro-Test-v1|%s' "$horde_key" | sha256sum | awk '{print $1}')
          printf '%s' "$CIPHER_B64" | base64 -d > /tmp/wiro.enc
          openssl enc -d -aes-256-cbc -K "$decrypt_hex" -iv "$IV_HEX" -in /tmp/wiro.enc -out /tmp/wiro.json
          WIRO_KEY=$(jq -r '.key' /tmp/wiro.json)
          WIRO_SECRET=$(jq -r '.secret' /tmp/wiro.json)
          test -n "$WIRO_KEY"
          test -n "$WIRO_SECRET"
          echo "::add-mask::$WIRO_KEY"
          echo "::add-mask::$WIRO_SECRET"
          printf '%s' "$WIRO_KEY" > /tmp/wiro.key
          printf '%s' "$WIRO_SECRET" > /tmp/wiro.secret
          echo 'credentials_decrypted=yes'

      - name: Check model schema and run bikini rear-view generation
        run: |
          set +e
          key=$(cat /tmp/wiro.key)
          secret=$(cat /tmp/wiro.secret)
          echo "::add-mask::$key"
          echo "::add-mask::$secret"

          signed_post() {
            url="$1"
            body="$2"
            outfile="$3"
            nonce=$(date +%s%N)
            sig=$(printf '%s%s' "$secret" "$nonce" | openssl dgst -sha256 -hmac "$key" | awk '{print $NF}')
            curl -sS -o "$outfile" -w '%{http_code}' --max-time 180 -X POST \
              -H "x-api-key: $key" \
              -H "x-signature: $sig" \
              -H "x-nonce: $nonce" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$body" "$url"
          }

          detail_code=$(signed_post 'https://api.wiro.ai/v1/Tool/Detail' '{"slugowner":"bytedance","slugproject":"seedream-v4-5-uncensored","summary":false}' /tmp/detail.json)
          echo "detail_http=$detail_code"
          echo "detail_result=$(jq -r '.result // false' /tmp/detail.json 2>/dev/null)"
          jq -r '.tool[0].dynamicprice // "pricing_unknown"' /tmp/detail.json 2>/dev/null | sed 's/^/dynamicprice=/'
          jq -r '[.tool[0].parameters[]?.id // .tool[0].parameters[]?.name] | map(select(. != null)) | join(",")' /tmp/detail.json 2>/dev/null | sed 's/^/parameter_ids=/'

          prompt='Photorealistic fashion photograph of an adult woman, age 25, standing on a tropical beach in a tasteful two-piece bikini, photographed from behind, full-body rear view, relaxed natural pose, non-explicit swimwear editorial, realistic anatomy, natural skin texture, soft daylight, 3:4 composition, high detail. Generate exactly one image.'
          run_body=$(jq -nc --arg p "$prompt" '{prompt:$p,maxImages:1,watermark:"false"}')
          run_code=$(signed_post 'https://api.wiro.ai/v1/Run/ByteDance/seedream-v4-5-uncensored' "$run_body" /tmp/run.json)
          echo "run_http=$run_code"
          echo "run_result=$(jq -r '.result // false' /tmp/run.json 2>/dev/null)"
          jq -c '.errors // []' /tmp/run.json 2>/dev/null | sed 's/^/run_errors=/'
          taskid=$(jq -r '.taskid // empty' /tmp/run.json 2>/dev/null)
          echo "task_created=$([ -n "$taskid" ] && echo yes || echo no)"
          if [ -z "$taskid" ]; then exit 0; fi

          for i in $(seq 1 30); do
            sleep 5
            detail_body=$(jq -nc --arg id "$taskid" '{taskid:$id}')
            task_code=$(signed_post 'https://api.wiro.ai/v1/Task/Detail' "$detail_body" /tmp/task.json)
            status=$(jq -r '.tasklist[0].status // empty' /tmp/task.json 2>/dev/null)
            pexit=$(jq -r '.tasklist[0].pexit // empty' /tmp/task.json 2>/dev/null)
            echo "poll=$i http=$task_code status=${status:-unknown} pexit=${pexit:-pending}"
            if [ "$status" = "task_postprocess_end" ] || [ "$status" = "task_error" ] || [ "$status" = "task_cancel" ]; then break; fi
          done

          echo "final_status=$(jq -r '.tasklist[0].status // "unknown"' /tmp/task.json 2>/dev/null)"
          echo "final_pexit=$(jq -r '.tasklist[0].pexit // "unknown"' /tmp/task.json 2>/dev/null)"
          echo "totalcost=$(jq -r '.tasklist[0].totalcost // "unknown"' /tmp/task.json 2>/dev/null)"
          output=$(jq -r '.tasklist[0].outputs[0].url // empty' /tmp/task.json 2>/dev/null)
          echo "image_received=$([ -n "$output" ] && echo yes || echo no)"
          if [ -n "$output" ]; then
            curl -sS -L --max-time 120 "$output" -o /tmp/wiro-output
            file /tmp/wiro-output || true
            bytes=$(wc -c < /tmp/wiro-output)
            echo "image_bytes=$bytes"
          fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/settings.php /tmp/wiro.enc /tmp/wiro.json /tmp/wiro.key /tmp/wiro.secret /tmp/detail.json /tmp/run.json /tmp/task.json /tmp/wiro-output
