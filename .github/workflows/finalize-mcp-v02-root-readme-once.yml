name: Finalize MCP v0.2 root README once

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - '.github/workflows/finalize-mcp-v02-root-readme-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/domain-catalog-v2
          fetch-depth: 0
      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('refactor-v2/README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('`generation-context-v1`', '`generation-context-v2`')
          old = '''`context.service.ts` и MCP `build_generation_context` собирают:\n\n```text\nGenerationContext\n├── Persona structured data + labels + aiContext + assets\n├── Outfit structured data + labels + aiContext + assets\n├── Scene structured data + labels + aiContext + assets\n├── canonicalAssets\n└── referenceAssets\n```\n'''
          new = '''`context.service.ts` и MCP собирают общий `generation-context-v2`:\n\n```text\nGenerationContext v2\n├── Persona structured data + labels + aiContext + assets\n├── Outfit structured data + labels + aiContext + assets\n├── Scene structured data + labels + aiContext + assets\n├── VisualPackage\n│   ├── primary face/body references\n│   └── ranked recommended assets\n├── canonicalAssets\n└── referenceAssets\n```\n\nДля интерактивного ChatGPT workflow MCP v0.2 добавляет high-level tools:\n\n- `get_visual_package` - получить лучшие сохраненные фото и actual MCP image content;\n- `prepare_image_generation` - собрать Persona/optional Outfit/Scene + `generation-context-v2` + reference images + `host_action=native_image_generation`.\n\nCharacterMaker остается источником canonical identity/context/references. Если пользователь просит создать изображение и MCP host имеет собственный native image generator, host должен продолжить генерацию после `prepare_image_generation`, а не требовать отдельный provider-specific `generate_image` tool внутри CharacterMaker.\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'prepare_image_generation' not in s:
              raise SystemExit('Expected GenerationContext block not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-mcp-v02-root-readme-once.yml
          git add refactor-v2/README.md
          git diff --cached --check
          git commit -m 'docs: align root README with generation-context-v2'
          git push origin HEAD:refactor/domain-catalog-v2
