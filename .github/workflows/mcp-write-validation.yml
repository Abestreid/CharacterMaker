name: CharacterMaker MCP Write Validation

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - '.github/workflows/mcp-write-validation.yml'

permissions:
  contents: read
  statuses: write

env:
  MCP_URL: https://kszybiwhchwekpmramxn.supabase.co/functions/v1/charactermaker-mcp
  FIXTURE_SLUG: mcp-write-test-20260807

jobs:
  validate-write:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n --arg state pending --arg target_url "$MCP_URL/health" --arg description "MCP write validation in progress" --arg context "mcp/write-test" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Initialize MCP
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data-binary '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"github-actions-write-validation","version":"1.0.0"}}}' \
            -D /tmp/init.headers -o /tmp/init.raw
          python .github/scripts/parse-mcp-response.py /tmp/init.raw /tmp/init.json
          protocol=$(jq -r '.result.protocolVersion' /tmp/init.json)
          session=$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r", "", $2); print $2}' /tmp/init.headers | tail -n1)
          echo "MCP_PROTOCOL_VERSION=$protocol" >> "$GITHUB_ENV"
          echo "MCP_SESSION_ID=$session" >> "$GITHUB_ENV"
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $protocol" --data-binary '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}')
          if [ -n "$session" ]; then args+=(-H "Mcp-Session-Id: $session"); fi
          curl "${args[@]}" -o /tmp/initialized.raw

      - name: Create fixture Persona through MCP
        run: |
          body=$(jq -nc --arg slug "$FIXTURE_SLUG" '{jsonrpc:"2.0",id:2,method:"tools/call",params:{name:"create_character",arguments:{name:"__MCP_WRITE_TEST__",slug:$slug,description:"Temporary MCP write validation fixture",age:25,parameters:[{catalog_id:"gender",option_id:"female",position:0},{catalog_id:"eye_color",option_id:"green",position:0}],ai_context:{summary:"temporary write validation",schemaVersion:"ai-context-v1"}}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/create.raw
          python .github/scripts/parse-mcp-response.py /tmp/create.raw /tmp/create.json
          jq -e '.result.isError != true' /tmp/create.json >/dev/null
          fixture_id=$(jq -r '.result.structuredContent.id' /tmp/create.json)
          test -n "$fixture_id"
          echo "FIXTURE_ID=$fixture_id" >> "$GITHUB_ENV"

      - name: Read created Persona through MCP
        run: |
          body=$(jq -nc --arg id "$FIXTURE_ID" '{jsonrpc:"2.0",id:3,method:"tools/call",params:{name:"get_preset",arguments:{kind:"character",id_or_slug:$id,include_assets:false}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/get-created.raw
          python .github/scripts/parse-mcp-response.py /tmp/get-created.raw /tmp/get-created.json
          jq -e '.result.structuredContent.entity.name == "__MCP_WRITE_TEST__"' /tmp/get-created.json >/dev/null
          jq -e '.result.structuredContent.parameters | map(select(.catalog.id == "eye_color"))[0].value.id == "green"' /tmp/get-created.json >/dev/null

      - name: Patch only eye color through MCP
        run: |
          body=$(jq -nc --arg id "$FIXTURE_ID" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:"patch_preset",arguments:{kind:"character",id:$id,expected_version:1,ai_context:{summary:"patched through MCP"},parameters:[{catalog_id:"eye_color",option_id:"blue",position:0}]}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/patch.raw
          python .github/scripts/parse-mcp-response.py /tmp/patch.raw /tmp/patch.json
          jq -e '.result.isError != true' /tmp/patch.json >/dev/null
          jq -e '.result.structuredContent.version == 2' /tmp/patch.json >/dev/null

      - name: Verify partial patch preserved other data
        run: |
          body=$(jq -nc --arg id "$FIXTURE_ID" '{jsonrpc:"2.0",id:5,method:"tools/call",params:{name:"get_preset",arguments:{kind:"character",id_or_slug:$id,include_assets:false}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/get-patched.raw
          python .github/scripts/parse-mcp-response.py /tmp/get-patched.raw /tmp/get-patched.json
          jq -e '.result.structuredContent.entity.age == 25' /tmp/get-patched.json >/dev/null
          jq -e '.result.structuredContent.entity.ai_context.summary == "patched through MCP"' /tmp/get-patched.json >/dev/null
          jq -e '.result.structuredContent.parameters | map(select(.catalog.id == "gender"))[0].value.id == "female"' /tmp/get-patched.json >/dev/null
          jq -e '.result.structuredContent.parameters | map(select(.catalog.id == "eye_color"))[0].value.id == "blue"' /tmp/get-patched.json >/dev/null

      - name: Archive fixture through MCP
        run: |
          body=$(jq -nc --arg id "$FIXTURE_ID" '{jsonrpc:"2.0",id:6,method:"tools/call",params:{name:"archive_preset",arguments:{kind:"character",id:$id}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/archive.raw
          python .github/scripts/parse-mcp-response.py /tmp/archive.raw /tmp/archive.json
          jq -e '.result.structuredContent.archived == true' /tmp/archive.json >/dev/null

      - name: Verify fixture is hidden from active library
        run: |
          body=$(jq -nc --arg slug "$FIXTURE_SLUG" '{jsonrpc:"2.0",id:7,method:"tools/call",params:{name:"search_presets",arguments:{kind:"character",query:$slug,limit:5}}}')
          args=(--fail-with-body --silent --show-error --max-time 30 -X POST "$MCP_URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "MCP-Protocol-Version: $MCP_PROTOCOL_VERSION" --data-binary "$body")
          if [ -n "$MCP_SESSION_ID" ]; then args+=(-H "Mcp-Session-Id: $MCP_SESSION_ID"); fi
          curl "${args[@]}" -o /tmp/search-archived.raw
          python .github/scripts/parse-mcp-response.py /tmp/search-archived.raw /tmp/search-archived.json
          jq -e '.result.structuredContent.count == 0' /tmp/search-archived.json >/dev/null

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n --arg state success --arg target_url "$MCP_URL/health" --arg description "MCP create, read, partial patch and archive passed" --arg context "mcp/write-test" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n --arg state failure --arg target_url "$MCP_URL/health" --arg description "MCP write validation failed" --arg context "mcp/write-test" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
