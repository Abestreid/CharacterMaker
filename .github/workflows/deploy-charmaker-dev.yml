name: Deploy CharacterMaker V2 to dev

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-charmaker-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'refactor-v2/**'
      - '.github/workflows/deploy-charmaker-dev.yml'

concurrency:
  group: charmaker-dev-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.head_ref == 'refactor/domain-catalog-v2'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: refactor-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build production frontend
        run: npm run build

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
        working-directory: .

      - name: Deploy dist to InfinityFree /dev
        env:
          FTP_SERVER: ${{ secrets.CHARMAKER_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.CHARMAKER_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHARMAKER_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          lftp -c "
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -p 21 ftp://$FTP_SERVER;
            user $FTP_USERNAME $FTP_PASSWORD;
            mkdir -p /htdocs/dev;
            mirror --reverse --delete --verbose --parallel=4 --create-dirs dist/ /htdocs/dev/;
            bye
          "

      - name: Smoke check deployed site
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 30 https://charmaker.free.nf/dev/ -o /tmp/charmaker-dev.html; then
              break
            fi
            sleep 10
          done
          test -s /tmp/charmaker-dev.html
          grep -qi '<div id="root"' /tmp/charmaker-dev.html
        working-directory: .

      - name: Install Chromium for visual verification
        run: npx --yes playwright@latest install --with-deps chromium
        working-directory: .

      - name: Capture desktop screenshot
        run: npx --yes playwright@latest screenshot --device="Desktop Chrome" --wait-for-timeout=3000 https://charmaker.free.nf/dev/ /tmp/charmaker-dev-desktop.png
        working-directory: .

      - name: Capture mobile screenshot
        run: npx --yes playwright@latest screenshot --device="iPhone 13" --wait-for-timeout=3000 https://charmaker.free.nf/dev/ /tmp/charmaker-dev-mobile.png
        working-directory: .

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: charmaker-dev-screenshots
          path: |
            /tmp/charmaker-dev-desktop.png
            /tmp/charmaker-dev-mobile.png
          retention-days: 7
