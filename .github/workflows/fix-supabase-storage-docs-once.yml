name: Finalize Supabase Storage cleanup docs once

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - '.github/workflows/fix-supabase-storage-docs-once.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: refactor/domain-catalog-v2
          fetch-depth: 0

      - name: Update authoritative docs
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('refactor-v2/supabase/README.md')
          text = readme.read_text(encoding='utf-8')
          old = '- empty Supabase Storage buckets from the discarded storage design;'
          new = '- discarded Supabase Storage experiment; its empty legacy buckets were removed by `202608071720_remove_unused_storage_buckets.sql`;'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Could not locate the legacy Storage bullet in supabase/README.md')

          section = '''## Supabase Storage cleanup\n\nCharacterMaker does not use Supabase Storage. Before removal, `storage.objects` was asserted to contain zero rows. All remaining empty legacy buckets from the discarded early design were then deleted by migration:\n\n`supabase/migrations/202608071720_remove_unused_storage_buckets.sql`\n\nCurrent media architecture remains InfinityFree `/media/...` plus Supabase `assets` metadata/relations.\n\n'''
          if '## Supabase Storage cleanup' not in text:
              marker = '## Backups\n'
              if marker not in text:
                  marker = '## Deprecated artifacts\n'
              if marker not in text:
                  raise SystemExit('Could not find insertion point in supabase/README.md')
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('refactor-v2/docs/CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry = '''### Removal of discarded Supabase Storage artifacts\n\n- подтверждено `storage.objects = 0` перед удалением;\n- все оставшиеся пустые legacy Supabase Storage buckets удалены;\n- применена и сохранена в Git migration `202608071720_remove_unused_storage_buckets.sql`;\n- текущая media architecture окончательно остается InfinityFree `/media/...` + Supabase `assets` metadata/relations, без Supabase Storage.\n\n'''
          if '### Removal of discarded Supabase Storage artifacts' not in c:
              marker = '## 2026-08-07\n\n'
              if marker not in c:
                  raise SystemExit('Could not find 2026-08-07 changelog section')
              c = c.replace(marker, marker + entry, 1)
          changelog.write_text(c, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-supabase-storage-docs-once.yml
          git add refactor-v2/supabase/README.md refactor-v2/docs/CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: finalize removed Supabase Storage artifacts'
          git push origin HEAD:refactor/domain-catalog-v2
