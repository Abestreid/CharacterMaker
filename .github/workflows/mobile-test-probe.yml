name: Mobile Test Probe

on:
  push:
    branches:
      - refactor/domain-catalog-v2
    paths:
      - '.github/workflows/mobile-test-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  TARGET_URL: https://charmaker.free.nf/dev/test/

jobs:
  pixel5-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark probe pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state pending \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "Pixel 5 touch probe running" \
            --arg context "probe/mobile-test" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Probe deployed Pixel 5 interactions
        id: probe
        run: |
          python3 - <<'PY'
          import json, os, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          url = os.environ['TARGET_URL'] + '?mobile-probe=' + os.environ['GITHUB_SHA']
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-background-timer-throttling')
          opts.add_experimental_option('mobileEmulation', {
              'deviceMetrics': {'width': 393, 'height': 851, 'pixelRatio': 2.75, 'touch': True, 'mobile': True},
              'userAgent': 'Mozilla/5.0 (Linux; Android 14; Pixel 5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36'
          })

          driver = webdriver.Chrome(options=opts)
          result = {'url': url}
          try:
              driver.set_page_load_timeout(45)
              driver.get(url)
              wait = WebDriverWait(driver, 30)
              slider = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, 'input[data-body-range="Обхват груди"]')))
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, 'path.body-path')))
              time.sleep(1)

              driver.execute_script('''
                window.__cmLongTasks = [];
                if ('PerformanceObserver' in window) {
                  try {
                    window.__cmObserver = new PerformanceObserver(list => {
                      for (const e of list.getEntries()) window.__cmLongTasks.push(e.duration);
                    });
                    window.__cmObserver.observe({entryTypes:['longtask']});
                  } catch (_) {}
                }
              ''')

              initial_value = float(slider.get_attribute('value'))
              initial_path = driver.find_element(By.CSS_SELECTOR, 'path.body-path').get_attribute('d')
              rect = driver.execute_script('const r=arguments[0].getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height};', slider)
              min_v = float(slider.get_attribute('min'))
              max_v = float(slider.get_attribute('max'))
              start_ratio = (initial_value - min_v) / (max_v - min_v)
              sx = rect['x'] + rect['w'] * start_ratio
              sy = rect['y'] + rect['h'] / 2
              tx = rect['x'] + rect['w'] * 0.88

              driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchStart','touchPoints':[{'x':sx,'y':sy,'id':1,'radiusX':3,'radiusY':3,'force':1}]})
              for i in range(1, 9):
                  x = sx + (tx - sx) * i / 8
                  driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchMove','touchPoints':[{'x':x,'y':sy,'id':1,'radiusX':3,'radiusY':3,'force':1}]})
                  time.sleep(0.025)
              driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchEnd','touchPoints':[]})
              time.sleep(0.35)

              moved_value = float(slider.get_attribute('value'))
              moved_path = driver.find_element(By.CSS_SELECTOR, 'path.body-path').get_attribute('d')

              driver.execute_script('window.scrollTo(0,0)')
              time.sleep(0.15)
              scroll_start = time.perf_counter()
              driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchStart','touchPoints':[{'x':375,'y':760,'id':2,'radiusX':3,'radiusY':3,'force':1}]})
              for i in range(1, 11):
                  y = 760 - 520 * i / 10
                  driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchMove','touchPoints':[{'x':375,'y':y,'id':2,'radiusX':3,'radiusY':3,'force':1}]})
                  time.sleep(0.02)
              driver.execute_cdp_cmd('Input.dispatchTouchEvent', {'type':'touchEnd','touchPoints':[]})
              time.sleep(0.45)
              scroll_elapsed_ms = (time.perf_counter() - scroll_start) * 1000
              scroll_y = float(driver.execute_script('return window.scrollY'))

              styles = driver.execute_script('''
                const s=getComputedStyle(document.querySelector('.preview-card'));
                return {position:s.position, backdrop:s.backdropFilter || s.webkitBackdropFilter || 'none'};
              ''')
              long_tasks = driver.execute_script('return window.__cmLongTasks || []')

              result.update({
                  'initial_value': initial_value,
                  'moved_value': moved_value,
                  'value_delta': moved_value - initial_value,
                  'path_changed': moved_path != initial_path,
                  'scroll_y': scroll_y,
                  'scroll_elapsed_ms': round(scroll_elapsed_ms, 1),
                  'long_tasks_count': len(long_tasks),
                  'max_long_task_ms': round(max(long_tasks) if long_tasks else 0, 1),
                  'preview_position': styles['position'],
                  'preview_backdrop': styles['backdrop'],
              })

              assert abs(moved_value - initial_value) >= 5, f'touch slider did not move enough: {initial_value}->{moved_value}'
              assert moved_path != initial_path, 'SVG body path did not change after slider input'
              assert scroll_y >= 120, f'touch scroll did not move page enough: scrollY={scroll_y}'
              assert styles['position'] != 'sticky', f'preview is still sticky on mobile: {styles}'
          except Exception as exc:
              result['error'] = repr(exc)
              raise
          finally:
              with open('/tmp/mobile-probe.json','w',encoding='utf-8') as f:
                  json.dump(result,f,ensure_ascii=False,indent=2)
              print(json.dumps(result,ensure_ascii=False,indent=2))
              driver.quit()
          PY

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-probe
          path: /tmp/mobile-probe.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark probe success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desc=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/mobile-probe.json'))
          print(f"Pixel5 slider {d['initial_value']:.0f}->{d['moved_value']:.0f}; scroll {d['scroll_y']:.0f}px; long {d['max_long_task_ms']:.0f}ms")
          PY
          )
          payload=$(jq -n --arg state success --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg description "$desc" --arg context "probe/mobile-test" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Mark probe failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n --arg state failure --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg description "Pixel5 deployed interaction probe failed - open run logs" --arg context "probe/mobile-test" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
